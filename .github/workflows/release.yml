      - name: Set commit-derived version timestamp
        run: |
          python3 - >> "$GITHUB_ENV" <<'PYTHON'
          import datetime, os, subprocess
          stamp = int(subprocess.check_output(['git', 'show', '-s', '--format=%ct', os.environ['SOURCE_SHA']]))
          print('BUILD_DATE=' + datetime.datetime.fromtimestamp(stamp, datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
          PYTHON
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an existing verified SHA image without overwriting
        id: existing
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs prepare
      - name: Build missing image locally
        if: steps.existing.outputs.existing == ''
        uses: docker/build-push-action@v6
        with:
          context: ./hinghwa-dict-backend
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: ghcr.io/e-dialect/hinghwa-dict-backend:sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=sha-${{ env.SOURCE_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.source=https://github.com/e-dialect/hinghwa-dict-backend
          cache-from: type=gha,scope=hinghwa-backend
          cache-to: type=gha,mode=max,scope=hinghwa-backend
      - name: Smoke exact image with offline model and synthetic empty SQLite
        run: |
          mkdir -p release
          python3 scripts/check-package.py --image "ghcr.io/e-dialect/hinghwa-dict-backend:sha-${SOURCE_SHA}" --source-sha "$SOURCE_SHA" > release/runtime.json
          cat release/runtime.json
