    name: Publish tested immutable backend package
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
      CI_RUNS: ${{ needs.authorize.outputs.ci_runs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - name: Reauthorize before registry login
        uses: actions/github-script@v8
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_CI_RUN_ID: ${{ inputs.ci_run_id }}
