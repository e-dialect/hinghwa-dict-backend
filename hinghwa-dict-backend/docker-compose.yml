version: "3.6"
services: 
    hinghwadict-backend:
        build: .
        image: "sheeplin/${SERVICE_NAME}"
        container_name: "${SERVICE_NAME}"
        restart: unless-stopped
        environment:
            SQLITE_DATABASE_PATH: /data/db.sqlite3
            SEMANTIC_SEARCH_DATA_DIR: /data/semantic-search
            SEMANTIC_SEARCH_ENCODING_BATCH_SIZE: ${SEMANTIC_SEARCH_ENCODING_BATCH_SIZE:-32}
        labels: 
            - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${HOST_ADDRESS}`)"
            - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=8000"
            - "traefik.http.routers.${SERVICE_NAME}.entrypoints=websecure"
            - "traefik.http.routers.${SERVICE_NAME}.tls=true"
            - "traefik.http.routers.${SERVICE_NAME}.tls.certresolver=tencentcloud"
            - "traefik.http.routers.${SERVICE_NAME}.middlewares=${SERVICE_NAME}-compress"
            - "traefik.http.middlewares.${SERVICE_NAME}-compress.compress=true"
        networks: 
            - traefik-global-proxy
        volumes:
           # Bind the complete SQLite parent so WAL/SHM/journals are shared.
           - ../../data:/data
           - ../../data/media:/usr/src/HinghwaDict-backend/media
           - ../../data/logs:/usr/src/HinghwaDict-backend/logs
           - ../../data/material:/usr/src/HinghwaDict-backend/material
    semantic-index-worker:
        build: .
        image: "sheeplin/${SERVICE_NAME}"
        container_name: "${SERVICE_NAME}-semantic-index-worker"
        command: ["python", "manage.py", "semantic_index_worker"]
        restart: unless-stopped
        environment:
            SQLITE_DATABASE_PATH: /data/db.sqlite3
            SEMANTIC_SEARCH_DATA_DIR: /data/semantic-search
            SEMANTIC_SEARCH_ENCODING_BATCH_SIZE: ${SEMANTIC_SEARCH_ENCODING_BATCH_SIZE:-32}
        volumes:
           # Bind the complete SQLite parent so WAL/SHM/journals are shared.
           - ../../data:/data
networks:
  traefik-global-proxy:
    external: true
